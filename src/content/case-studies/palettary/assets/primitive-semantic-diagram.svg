<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="t d">
  <title id="t">Primitive to semantic</title>
  <desc id="d">Four color primitives on the left, five semantic tokens on the right. color-link-default and color-button-primary both point at blue-600.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .sans { font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'Roboto Mono', ui-monospace, Consolas, Menlo, monospace; }
      .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; fill: #186534; }
      .sub { font-size: 14px; fill: #64748b; }
      .name { font-size: 15px; fill: #0f172a; }
      .hex { font-size: 14px; fill: #64748b; }
      .chip { fill: #f8fafc; stroke: #e2e8f0; }
      .token { fill: #ffffff; stroke: #cbd5e1; }
      .link { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="880" height="430" rx="16" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="56" y="56" class="mono eyebrow">PRIMITIVES</text>
  <text x="56" y="80" class="sans sub">What a color is. Palettary ships these.</text>
  <line x1="56" y1="100" x2="356" y2="100" stroke="#e2e8f0"/>

  <text x="500" y="56" class="mono eyebrow">SEMANTIC TOKENS</text>
  <text x="500" y="80" class="sans sub">What a color is for. You decide these.</text>
  <line x1="500" y1="100" x2="824" y2="100" stroke="#e2e8f0"/>

  <!-- Primitives -->
  <rect x="56" y="145" width="300" height="40" rx="8" class="chip"/>
  <rect x="68" y="153" width="24" height="24" rx="5" fill="#2563EB"/>
  <text x="104" y="170" class="mono name">blue-600</text>
  <text x="344" y="170" text-anchor="end" class="mono hex">#2563EB</text>

  <rect x="56" y="220" width="300" height="40" rx="8" class="chip"/>
  <rect x="68" y="228" width="24" height="24" rx="5" fill="#1D4ED8"/>
  <text x="104" y="245" class="mono name">blue-700</text>
  <text x="344" y="245" text-anchor="end" class="mono hex">#1D4ED8</text>

  <rect x="56" y="270" width="300" height="40" rx="8" class="chip"/>
  <rect x="68" y="278" width="24" height="24" rx="5" fill="#171717"/>
  <text x="104" y="295" class="mono name">neutral-900</text>
  <text x="344" y="295" text-anchor="end" class="mono hex">#171717</text>

  <rect x="56" y="320" width="300" height="40" rx="8" class="chip"/>
  <rect x="68.5" y="328.5" width="23" height="23" rx="5" fill="#FFFFFF" stroke="#cbd5e1"/>
  <text x="104" y="345" class="mono name">neutral-0</text>
  <text x="344" y="345" text-anchor="end" class="mono hex">#FFFFFF</text>

  <!-- References: each token points at a primitive -->
  <path d="M356 165 C 430 165, 424 140, 494 140" class="link" marker-end="url(#arrow)"/>
  <path d="M356 165 C 430 165, 424 190, 494 190" class="link" marker-end="url(#arrow)"/>
  <path d="M356 240 L 494 240" class="link" marker-end="url(#arrow)"/>
  <path d="M356 290 L 494 290" class="link" marker-end="url(#arrow)"/>
  <path d="M356 340 L 494 340" class="link" marker-end="url(#arrow)"/>

  <!-- Semantic tokens -->
  <rect x="500" y="120" width="324" height="40" rx="8" class="token"/>
  <text x="516" y="145" class="mono name">color-link-default</text>
  <circle cx="804" cy="140" r="8" fill="#2563EB"/>

  <rect x="500" y="170" width="324" height="40" rx="8" class="token"/>
  <text x="516" y="195" class="mono name">color-button-primary</text>
  <circle cx="804" cy="190" r="8" fill="#2563EB"/>

  <rect x="500" y="220" width="324" height="40" rx="8" class="token"/>
  <text x="516" y="245" class="mono name">color-button-primary-hover</text>
  <circle cx="804" cy="240" r="8" fill="#1D4ED8"/>

  <rect x="500" y="270" width="324" height="40" rx="8" class="token"/>
  <text x="516" y="295" class="mono name">color-text-default</text>
  <circle cx="804" cy="290" r="8" fill="#171717"/>

  <rect x="500" y="320" width="324" height="40" rx="8" class="token"/>
  <text x="516" y="345" class="mono name">color-surface-default</text>
  <circle cx="804" cy="340" r="7.5" fill="#FFFFFF" stroke="#cbd5e1"/>

  <!-- Takeaway -->
  <text x="56" y="400" class="sans sub">Change blue-600 once, and every token that points at it follows.</text>
</svg>
